spring.datasource.url=jdbc:mysql://localhost:3306/echanneling_db
spring.datasource.username=root
spring.datasource.password=123456789

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Allow the React dev server to call this API
app.cors.allowed-origin=http://localhost:5173

# JWT
app.jwt.secret=change-this-secret-key-before-deploying-to-production-please
app.jwt.expiration-ms=86400000

# Notifications
# Set to true and fill in spring.mail.* (e.g. a Gmail app password) to actually send emails.
# Left false by default so the app runs without any mail server configured; notifications are
# still recorded in the notifications table either way.
app.notifications.email-enabled=false
